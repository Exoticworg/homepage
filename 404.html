<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verirrt im Wald – ExoticWorg</title><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
@font-face{font-family:'Cinzel';src:url(/assets/cinzel.woff2) format('woff2');font-weight:400 900;font-display:swap}
@font-face{font-family:'Pirata One';src:url(/assets/pirata.woff2) format('woff2');font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 24px;color:#ece3d4;font:16px/1.6 "Segoe UI",system-ui,Arial,sans-serif;
 background:radial-gradient(800px 500px at 50% 10%,rgba(163,18,43,.3),transparent 65%),#0b090a}
.mond{width:130px;height:130px;margin:0 auto 26px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#f4ead6,#cdbb98 60%,#9c8a68);box-shadow:0 0 60px rgba(244,234,214,.25),0 0 140px rgba(163,18,43,.35);position:relative}
.mond:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 60%,rgba(0,0,0,.12) 0 12%,transparent 13%),radial-gradient(circle at 35% 70%,rgba(0,0,0,.1) 0 8%,transparent 9%)}
.k{font-family:'Cinzel';letter-spacing:.4em;font-size:13px;color:#c8a65d}
h1{font-family:'Pirata One';font-weight:400;font-size:clamp(40px,8vw,64px);line-height:1.05;margin:10px 0 14px}
p{max-width:520px;margin:0 auto;color:#cdbfaa}
a.btn{display:inline-block;margin-top:28px;padding:13px 24px;border-radius:10px;font-weight:600;text-decoration:none;color:#fff;background:linear-gradient(180deg,#c22a45,#8f1027);border:1px solid #d6324d;box-shadow:0 8px 24px rgba(163,18,43,.35)}
a.btn:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<main>
  <div class="mond" aria-hidden="true"></div>
  <div class="k">404 · SPUR VERLOREN</div>
  <h1>Du hast dich im Wald von Gilneas verirrt</h1>
  <p>Hier gibt es keine Fährte – nur Nebel, knackende Äste und irgendwo in der Ferne ein Heulen. Bevor dich etwas anderes findet als das Rudel: Folg dem Mondlicht zurück.</p>
  <a class="btn" href="/">Zurück zum Lagerfeuer</a>
</main>
</body>
</html>
